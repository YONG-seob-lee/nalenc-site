<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오리 숨쉬기 · 1회차 vs 2회차</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #1f1f1f; color: #eee; font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 32px; }
    h1 { font-size: 20px; margin: 0 0 6px; max-width: 100%; text-align: center; word-break: keep-all; }
    p.sub { margin: 0 0 20px; color: #aaa; font-size: 14px; text-align: center; line-height: 1.6; max-width: 100%; word-break: keep-all; }
    .pair { display: flex; gap: 16px; width: 100%; max-width: 1100px; }
    figure { flex: 1 1 0; min-width: 0; margin: 0; background: #2a2a2a; border-radius: 16px; overflow: hidden; }
    figure iframe { display: block; width: 100%; aspect-ratio: 1 / 1; border: 0; }
    figcaption { padding: 12px 16px 14px; font-size: 14px; line-height: 1.55; }
    figcaption b { display: block; font-size: 15px; margin-bottom: 2px; }
    .memo { color: #f5b942; }
    .muted { color: #999; font-size: 13px; }
    @media (max-width: 700px) { .pair { flex-direction: column; } figure { flex: none; } p.sub br { display: none; } }
  </style>
</head>
<body>
  <h1>오리가 숨을 쉬어요 — 고쳐 주세요 한 번</h1>
  <p class="sub">그림 한 장을 AI가 부위로 나누고 뼈를 넣어 만든 첫 동작(1회차)에, <br>메모 한 줄을 남겨 다시 맡긴 결과(2회차). 시험판이에요.</p>
  <div class="pair">
    <figure>
      <iframe src="round1.html" title="1회차 — 일반 idle"></iframe>
      <figcaption><b>1회차 · 일반 idle</b><span class="muted">몸 ±1.2% · 머리 ±6.5px · 2초 반복</span></figcaption>
    </figure>
    <figure>
      <iframe src="round2.html" title="2회차 — 메모 반영"></iframe>
      <figcaption><b>2회차 · 메모 반영</b><span class="memo">“숨을 조금 더 크게”</span> <span class="muted">→ 몸 ±1.7% · 머리 ±9.2px(약 1.4배), 나머지 그대로</span></figcaption>
    </figure>
  </div>
</body>
</html>
